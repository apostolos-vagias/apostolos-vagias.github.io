name: Refresh news from ORCID

on:
  schedule:
    # 06:15 UTC on the 1st of every month. Cron on GitHub is best-effort and
    # can be delayed under load, which is fine for a monthly refresh.
    - cron: "15 6 1 * *"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query ORCID and rewrite the auto-news block
        id: gen
        run: |
          python3 tools/update_news.py --max 6 | tee /tmp/out.txt
          if grep -q CHANGED /tmp/out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if anything changed
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh news from ORCID (automated)"
          git push
